<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>chatbox</title>
    <link rel="stylesheet" href="chatbox.css" />
  </head>
  <body>
    <section class="main-container">
    <header>
      <!-- <h2 class="header-title">James</h2> -->
      <img src="images/Navigation Bar.png" alt="navigation bar" />
    </header>
    <section class="main-container2">
      <div class="single-line-chat">
        <img src="images/Ellipse.png" alt="profile picture" class="profile-picture"/>
        <p class="chat-content">
          Really love your most recent photo. I’ve been trying to capture the
          same thing for a few months and would love some tips!
        </p>
      </div>

      <div class="single-line-chat">
        
        <p class="chat-content">
          A fast 50mm like f1.8 would help with the bokeh. I’ve been using primes as they tend to get a bit sharper images.
        </p>
        <img src="images/2nd-Ellipse.png" alt="profile picture" class="profile-picture"/>
      </div>

      <div class="single-line-chat">
        <img src="images/Ellipse.png" alt="profile picture" class="profile-picture"/>
        <p class="chat-content">
          Thank you! That was very helpful!
        </p>
      </div>

    </section>
    
    <footer>
        <hr>
        <div class="sticky-footer">
            <img src="images/home-Union.png" alt="homeIcon">
            <img src="images/search-Union.png" alt="homeIcon">
            <!-- <img src="images/positive-Union.png" alt="homeIcon" class="positiveUnion"> -->
            <p class="positiveUnion">+</p>
            <img src="images/chat-Union.png" alt="homeIcon" >
            <img src="images/person.png" alt="homeIcon">

        </div>
    </footer>
</section>
  </body>
  
</html>
